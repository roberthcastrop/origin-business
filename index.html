<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORIGIN</title>
<meta name="description" content="ORIGIN — Business Launch">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505}
body{overflow:hidden}
.hero{position:relative;width:100vw;height:100vh;height:100svh;background:#050505}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.hero a{position:absolute;inset:0;z-index:2}
@media (max-width:600px){
  .hero{height:100vh;height:100svh}
  .hero img{
    object-fit:contain;
    object-position:center center;
    width:100%;
    height:100%;
  }
}
</style>
</head>
<body>
<main class="hero">
<img src="origin-hero.png" alt="ORIGIN Business Launch">
<a href="home.html" aria-label="Entrar a ORIGIN"></a>
</main>
</body>
</html>
